<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WhatsApp Clone</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

    <!-- Sidebar Overlay for Mobile -->
    <div id="sidebarOverlay" class="sidebar-overlay"></div>

    <!-- Sidebar -->
    <div class="sidebar">
        <h2>Chats</h2>
        <input type="text" id="searchInput" placeholder="Search contact...">
        <ul id="contactList">
</ul>
    </div>

    <!-- Chat Section -->
    <div class="chat-section">
        <div class="chat-header">
    <div class="header-left">
        <button id="menuBtn" class="menu-btn">☰</button>
        <img id="headerAvatar" src="https://i.pravatar.cc/40?img=5" class="avatar">
        <div>
            <h3 id="chatName">Joy 💚</h3>
            <small id="statusText">online</small>
        </div>
    </div>
    <div class="header-right">
        <button id="clearChatBtn" title="Clear Chat History">🗑️</button>
        <button id="darkModeToggle">🌙</button>
    </div>
</div>

        <div class="chat-box" id="chatBox"></div>

        <div class="chat-input">
    <button id="emojiBtn">😀</button>
    <div id="emojiPicker" class="emoji-picker"></div>
    <input type="text" id="messageInput" placeholder="Type a message">
    <button id="sendBtn">Send</button>
</div>
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
